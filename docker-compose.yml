services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frontline
      POSTGRES_USER: frontline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frontline}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontline -d frontline"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Django: website, API, profiles, leaderboard
  web:
    build: .
    image: frontline-ops:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local defaults; set real values in a .env file (see .env.example) before exposing this anywhere.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},web
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_TRUST_PROXY: "1"
      GAME_SERVER_KEY: ${GAME_SERVER_KEY:-local-only-game-key}
      POSTGRES_DB: frontline
      POSTGRES_USER: frontline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frontline}
      POSTGRES_HOST: db
    restart: unless-stopped

  # Node.js real-time match server (same game rules as the browser)
  gameserver:
    build:
      context: .
      dockerfile: gameserver/Dockerfile
    image: frontline-ops-gameserver:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      DJANGO_URL: http://web:8000
      GAME_SERVER_KEY: ${GAME_SERVER_KEY:-local-only-game-key}
    restart: unless-stopped

  # nginx: one public port for the site and the game socket
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - gameserver
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
