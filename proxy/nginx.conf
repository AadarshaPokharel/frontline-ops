# One public entry point: the game socket goes to the Node game server, everything else to Django.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    location /ws {
        proxy_pass http://gameserver:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, not appended, so clients cannot spoof it
        proxy_read_timeout 120s;
        tcp_nodelay on;
    }

    # only the game server reports results, and it talks to Django directly on the private network
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
